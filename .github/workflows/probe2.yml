name: probe2

on:
  workflow_dispatch:
    inputs:
      n:
        description: "编号"
        required: true
        type: string

permissions:
  contents: write

jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U --quiet yt-dlp
          python -m pip install --quiet curl_cffi || true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ inputs.n }}
        run: python scripts/_probe2.py
