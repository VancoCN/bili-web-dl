name: bili-fetch

# 由网页 index.html 通过 REST API (workflow_dispatch) 触发。
# 结果统一发布到 Release（tag = dl-<job>）：
#   Release 正文 = meta.json（前端读取的元数据 / 错误信息）
#   Release 资产 = 下载好的 mp3 / mp4
#
# 注意：这里不用 yt-dlp。Actions runner 是机房 IP，B 站对 www.bilibili.com
# 的网页请求会直接返回 HTTP 412（换 UA / 带 cookie / --impersonate 均无效），
# 而 api.bilibili.com 正常，所以 scripts/bili.py 直接走官方 API。
run-name: bili ${{ inputs.mode }} ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "任务 ID（前端生成，用于回捞结果）"
        required: true
        type: string
      mode:
        description: "parse=只解析元数据 / download=解析并下载"
        required: true
        type: choice
        options: [parse, download]
        default: parse
      url:
        description: "B 站链接或 BV 号"
        required: true
        type: string
      kind:
        description: "download 时下载音频还是视频"
        required: false
        type: choice
        options: [audio, video]
        default: audio
      quality:
        description: "视频档位 qn：80=1080P / 64=720P / 32=480P"
        required: false
        type: string
        default: "80"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: bili-${{ inputs.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境检查
        run: |
          python -V
          ffmpeg -version | head -n 1

      - name: 清理过期 Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python scripts/cleanup.py

      - name: 解析 / 下载
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          URL_RAW: ${{ inputs.url }}
          KIND: ${{ inputs.kind }}
          QUALITY: ${{ inputs.quality }}
          JOB: ${{ inputs.job }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: python scripts/bili.py

      - name: 发布结果
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          JOB: ${{ inputs.job }}
        run: bash scripts/publish.sh
